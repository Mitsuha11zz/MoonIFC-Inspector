name: ci
on: [push, pull_request]
jobs:
  step-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon version --all
      - run: moon fmt --check packages/step_text
      - run: moon info packages/step_text
      - run: moon check packages/step_text --target all --deny-warn
      - run: moon test packages/step_text --target all --deny-warn
      - run: moon build packages/step_text --target wasm,wasm-gc,js,native
